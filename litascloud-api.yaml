        - $ref: "#/components/schemas/IceCandidateMessage"
        - $ref: "#/components/schemas/SessionActiveMessage"
        - $ref: "#/components/schemas/TimeWarningMessage"
        - $ref: "#/components/schemas/RecorderReadyMessage"
