        - $ref: "#/components/schemas/RecordStartMessage"
        - $ref: "#/components/schemas/RecordStopMessage"
        - $ref: "#/components/schemas/SdpOfferMessage"
        - $ref: "#/components/schemas/IceCandidateMessage"
        - $ref: "#/components/schemas/ErrorMessage"
