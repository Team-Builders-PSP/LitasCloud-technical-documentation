    KeyCode:
      type: string
      pattern: "^(Key[A-Z]|Digit[0-9]|Arrow(Up|Down|Left|Right)|Space|Enter|Escape|Shift(Left|Right))$"
      description: |
        Value of the browser's `KeyboardEvent.code`. Only these keys are on the whitelist (M5,
        NFR-13): letters (`KeyA` to `KeyZ`), digits (`Digit0` to `Digit9`), the four arrow keys,
        `Space`, `Enter`, `Escape`, `ShiftLeft` and `ShiftRight`. The Host Agent silently ignores
        every other code. Ctrl, Alt and the Windows key are never applied.
      example: KeyW
    DcKeyMessage:
      type: object
      description: Browser to Host Agent. A whitelisted key was pressed or released (M5).
      required: [t, code, down]
      additionalProperties: false
      properties:
        t:
          type: string
          enum: [key]
        code:
          $ref: "#/components/schemas/KeyCode"
        down:
          type: boolean
          description: true = pressed, false = released.
        seq:
          type: integer
          minimum: 0
          description: Optional counter that grows with every key message, to help debugging.
      example:
        t: key
        code: KeyW
        down: true
        seq: 1042
    DcMouseMoveMessage:
      type: object
      description: Browser to Host Agent. Relative mouse movement since the last message (M5).
      required: [t, dx, dy]
      additionalProperties: false
      properties:
        t:
          type: string
          enum: [mouse_move]
        dx:
          type: integer
        dy:
          type: integer
      example:
        t: mouse_move
        dx: 5
        dy: -3
    DcMouseButtonMessage:
      type: object
      description: Browser to Host Agent. Left or right mouse button pressed or released (M5). Other buttons are ignored.
      required: [t, button, down]
      additionalProperties: false
      properties:
        t:
          type: string
          enum: [mouse_button]
        button:
          type: string
          enum: [left, right]
        down:
          type: boolean
          description: true = pressed, false = released.
      example:
        t: mouse_button
        button: left
        down: true
    DcMouseWheelMessage:
      type: object
      description: Browser to Host Agent. Mouse wheel scroll (M5).
      required: [t, dy]
      additionalProperties: false
      properties:
        t:
          type: string
          enum: [mouse_wheel]
        dy:
          type: integer
          description: Scroll amount. Negative values scroll up.
      example:
        t: mouse_wheel
        dy: -120
    DcPingMessage:
      type: object
      description: Browser to Host Agent, every second. Used for the latency display (M7) and as the heartbeat (NFR-07).
      required: [t, ts]
      additionalProperties: false
      properties:
        t:
          type: string
          enum: [ping]
        ts:
          type: integer
          format: int64
          description: Browser time in milliseconds since 1970-01-01 when the ping was sent.
      example:
        t: ping
        ts: 1730550000123
    DcPongMessage:
      type: object
      description: Host Agent to Browser. Answer to `ping` with the same `ts`. The Browser computes the round-trip latency as the current time minus `ts`.
      required: [t, ts]
      additionalProperties: false
      properties:
        t:
          type: string
          enum: [pong]
        ts:
          type: integer
          format: int64
          description: Same value as in the `ping` it answers.
      example:
        t: pong
        ts: 1730550000123
    DataChannelMessage:
      description: Every message on the WebRTC data channel `control`, in both directions. Browser to Host Agent - `key`, `mouse_move`, `mouse_button`, `mouse_wheel`, `ping`. Host Agent to Browser - `pong`.
      oneOf:
        - $ref: "#/components/schemas/DcKeyMessage"
        - $ref: "#/components/schemas/DcMouseMoveMessage"
        - $ref: "#/components/schemas/DcMouseButtonMessage"
        - $ref: "#/components/schemas/DcMouseWheelMessage"
        - $ref: "#/components/schemas/DcPingMessage"
        - $ref: "#/components/schemas/DcPongMessage"
      discriminator:
        propertyName: t
        mapping:
          key: "#/components/schemas/DcKeyMessage"
          mouse_move: "#/components/schemas/DcMouseMoveMessage"
          mouse_button: "#/components/schemas/DcMouseButtonMessage"
          mouse_wheel: "#/components/schemas/DcMouseWheelMessage"
          ping: "#/components/schemas/DcPingMessage"
          pong: "#/components/schemas/DcPongMessage"
