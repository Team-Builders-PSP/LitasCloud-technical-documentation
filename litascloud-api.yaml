        propertyName: type
        mapping:
          record_start: "#/components/schemas/RecordStartMessage"
          record_stop: "#/components/schemas/RecordStopMessage"
          sdp_offer: "#/components/schemas/SdpOfferMessage"
          ice_candidate: "#/components/schemas/IceCandidateMessage"
